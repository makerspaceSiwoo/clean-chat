# Windows·macOS 독립 실행 앱(PyInstaller) 빌드. 결과는 Actions 실행 화면의 Artifacts에서 zip으로 받는다.
# 만든 zip 을 그대로 올려서(archive: false) 받은 zip 을 한 번만 풀면 앱이 나온다 (예전에는 zip 안에 zip).
# 두 OS 모두 같은 명령(scripts/build_desktop.py, ui·ocr·analyze-app·rewrite·report extra)으로 빌드한다.
# analyze 모델 실행 패키지(torch·transformers)는 넣고, 가중치(약 440MB)는 앱이 첫 실행 준비 화면에서 내려받는다.
# macOS는 인증서 없이 서명한 Apple Silicon(arm64) 전용 "Clean Chat.app"이다 (권한이 버전 간에 유지되게 번들 ID 로 서명).
# test 브랜치에 push하거나, Actions 탭에서 "Run workflow"로 원하는 브랜치를 골라 직접 실행한다.
# LLM 키는 넣지 않는다. 받는 사람이 첫 실행 준비 화면에서 입력한다.
name: build-desktop
on:
  workflow_dispatch:
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"  # Windows 콘솔 기본 인코딩에서 한글 출력이 깨지지 않게
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 설치 (UI + OCR + 분류 모델 + LLM)
        run: uv sync --locked --extra ui --extra ocr --extra analyze-app --extra rewrite --extra report
      - name: 빌드
        run: uv run --extra ui --extra ocr --extra analyze-app --extra rewrite --extra report --with "pyinstaller>=6.16,<7" python scripts/build_desktop.py
      - name: 번들 확인 (OCR 스크립트 포함)
        shell: pwsh
        run: |
          $app = "dist/Clean Chat"
          if (-not (Test-Path "$app/Clean Chat.exe")) { throw "exe가 없습니다" }
          $ps1 = Get-ChildItem -Recurse $app -Filter windows.ps1
          if (-not $ps1) { throw "windows.ps1이 번들에 없습니다" }
          $ps1 | ForEach-Object { $_.FullName }
      - name: 설치 점검 (묶인 패키지를 모두 불러온다)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Clean Chat/Clean Chat.exe" -ArgumentList "--check" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "--check 실패 (exit $($p.ExitCode)): 설치 파일에서 빠진 패키지가 있습니다" }
      - name: 실행 확인 (데모 15초)
        shell: pwsh
        env:
          CLEAN_CHAT_SKIP_SETUP: "1"  # 첫 실행 준비 화면(키 입력·모델 내려받기)을 건너뛴다
        run: |
          $p = Start-Process -FilePath "dist/Clean Chat/Clean Chat.exe" -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "앱이 15초 안에 종료됐습니다 (exit $($p.ExitCode))" }
          $count = @(Get-Process -Name "Clean Chat" -ErrorAction SilentlyContinue).Count
          Get-Process -Name "Clean Chat" -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($count -gt 2) { throw "앱이 자기 자신을 다시 실행했습니다 (프로세스 $count 개)" }
      - name: zip 만들기
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $ref = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'  # feat/x 같은 브랜치 이름의 / 제거
          $name = "CleanChat-windows-$ref-$sha"
          Compress-Archive -Path "dist/Clean Chat" -DestinationPath "$name.zip"
          "ZIP_NAME=$name" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_NAME }}.zip  # archive: false 면 파일 이름이 Artifact 이름이 된다
          archive: false  # zip 을 한 번 더 감싸지 않는다
          retention-days: 14

  macos:
    runs-on: macos-latest  # Apple Silicon (arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 설치 (UI + OCR + 분류 모델 + LLM)
        run: uv sync --locked --extra ui --extra ocr --extra analyze-app --extra rewrite --extra report
      - name: 빌드
        run: uv run --extra ui --extra ocr --extra analyze-app --extra rewrite --extra report --with "pyinstaller>=6.16,<7" python scripts/build_desktop.py
      - name: 번들 확인 (OCR 스크립트·화면 캡처 라이브러리 포함)
        run: |
          app="dist/Clean Chat.app"
          test -x "$app/Contents/MacOS/Clean Chat"
          find "$app" -name windows.ps1 | grep -q .
          find "$app" -name region_snapshot.dylib | grep -q .
          # 화면 기록 권한이 빌드마다 초기화되지 않게, 권한을 묶는 기준이 번들 ID 여야 한다.
          codesign --verify --strict "$app"
          codesign -d -r- "$app" 2>&1 | grep -q 'designated => identifier "com.cleanchat.desktop"'
          file "$app/Contents/MacOS/Clean Chat"
      - name: 설치 점검 (묶인 패키지를 모두 불러온다)
        run: '"dist/Clean Chat.app/Contents/MacOS/Clean Chat" --check'
      - name: 실행 확인 (데모 15초)
        env:
          CLEAN_CHAT_SKIP_SETUP: "1"  # 첫 실행 준비 화면(키 입력·모델 내려받기)을 건너뛴다
        run: |
          "dist/Clean Chat.app/Contents/MacOS/Clean Chat" --demo &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "앱이 15초 안에 종료됐습니다"; exit 1; }
          count=$(pgrep -f "MacOS/Clean Chat" | wc -l | tr -d ' ')
          pkill -f "MacOS/Clean Chat" || true
          [ "$count" -le 2 ] || { echo "앱이 자기 자신을 다시 실행했습니다 (프로세스 $count 개)"; exit 1; }
      - name: zip 만들기
        run: |
          ref=$(echo "${{ github.ref_name }}" | sed 's/[^A-Za-z0-9._-]/-/g')  # feat/x 같은 브랜치 이름의 / 제거
          name="CleanChat-macos-$ref-${GITHUB_SHA::7}"
          ditto -c -k --keepParent "dist/Clean Chat.app" "$name.zip"  # 실행 권한·서명 유지
          echo "ZIP_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_NAME }}.zip  # archive: false 면 파일 이름이 Artifact 이름이 된다
          archive: false  # zip 을 한 번 더 감싸지 않는다
          retention-days: 14
