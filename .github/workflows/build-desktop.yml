# Windows·macOS 독립 실행 앱(PyInstaller) 빌드. 결과는 Actions 실행 화면의 Artifacts에서 zip으로 받는다.
# 두 OS 모두 같은 명령(scripts/build_desktop.py, ui·ocr·rewrite·report extra)으로 빌드한다.
# macOS는 서명하지 않은 Apple Silicon(arm64) 전용 "Clean Chat Preview.app"이다.
# test 브랜치에 push하거나, Actions 탭에서 "Run workflow"로 원하는 브랜치를 골라 직접 실행한다.
# LLM 키는 넣지 않는다. 받는 사람이 앱 설정 화면에서 입력한다.
name: build-desktop
on:
  workflow_dispatch:
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"  # Windows 콘솔 기본 인코딩에서 한글 출력이 깨지지 않게
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 설치 (UI + LLM)
        run: uv sync --locked --extra ui --extra ocr --extra rewrite --extra report
      - name: 빌드
        run: uv run --extra ui --extra ocr --extra rewrite --extra report --with "pyinstaller>=6.16,<7" python scripts/build_desktop.py
      - name: 번들 확인 (OCR 스크립트 포함)
        shell: pwsh
        run: |
          $app = "dist/Clean Chat"
          if (-not (Test-Path "$app/Clean Chat.exe")) { throw "exe가 없습니다" }
          $ps1 = Get-ChildItem -Recurse $app -Filter windows.ps1
          if (-not $ps1) { throw "windows.ps1이 번들에 없습니다" }
          $ps1 | ForEach-Object { $_.FullName }
      - name: 실행 확인 (데모 15초)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Clean Chat/Clean Chat.exe" -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "앱이 15초 안에 종료됐습니다 (exit $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: zip 만들기
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $ref = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'  # feat/x 같은 브랜치 이름의 / 제거
          $name = "CleanChat-windows-$ref-$sha"
          Compress-Archive -Path "dist/Clean Chat" -DestinationPath "$name.zip"
          "ZIP_NAME=$name" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 14
          compression-level: 0  # 이미 zip이라 다시 압축하지 않는다

  macos:
    runs-on: macos-latest  # Apple Silicon (arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 설치 (UI + LLM)
        run: uv sync --locked --extra ui --extra ocr --extra rewrite --extra report
      - name: 빌드
        run: uv run --extra ui --extra ocr --extra rewrite --extra report --with "pyinstaller>=6.16,<7" python scripts/build_desktop.py
      - name: 번들 확인 (OCR 스크립트·화면 캡처 라이브러리 포함)
        run: |
          app="dist/Clean Chat Preview.app"
          test -x "$app/Contents/MacOS/Clean Chat Preview"
          find "$app" -name windows.ps1 | grep -q .
          find "$app" -name region_snapshot.dylib | grep -q .
          file "$app/Contents/MacOS/Clean Chat Preview"
      - name: 실행 확인 (데모 15초)
        run: |
          "dist/Clean Chat Preview.app/Contents/MacOS/Clean Chat Preview" --demo &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "앱이 15초 안에 종료됐습니다"; exit 1; }
          kill "$pid"
      - name: zip 만들기
        run: |
          ref=$(echo "${{ github.ref_name }}" | sed 's/[^A-Za-z0-9._-]/-/g')  # feat/x 같은 브랜치 이름의 / 제거
          name="CleanChat-macos-$ref-${GITHUB_SHA::7}"
          ditto -c -k --keepParent "dist/Clean Chat Preview.app" "$name.zip"  # 실행 권한·서명 유지
          echo "ZIP_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 14
          compression-level: 0
