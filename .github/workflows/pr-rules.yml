# 모듈 범위 검사 (ADR-0018). 브랜치 이름이 <모듈>/<작업 내용> 인 PR 만 검사한다 (예: parse/colon-fix).
# 모듈 범위 밖 파일을 바꾸면 실패 → 리드가 리뷰할 때 "모듈 범위를 넘는 변경"으로 보고 판단한다 (병합을 막지는 않음).
# 브랜치 이름·PR 제목 형식은 검사하지 않는다. main 보호는 GitHub 규칙(protect-main)이 맡는다.
name: pr-rules
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  module-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 모듈 범위 검사 (<모듈>/<작업 내용> 브랜치)
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
          cd scripts && python check_module_boundary.py "$HEAD_REF" $FILES
