# 데스크톱 앱(Python) 검사. 웹앱(simulator/)만 바뀐 커밋은 건너뛴다 (그쪽은 simulator.yml).
# Mac(개발 환경)과 Windows(실제 실행 환경) 양쪽에서 설치·테스트가 되는지 매번 확인한다.
name: ci
on:
  pull_request:
    paths-ignore: ["simulator/**", ".github/workflows/simulator.yml"]
  push:
    branches: [main, develop]
    paths-ignore: ["simulator/**", ".github/workflows/simulator.yml"]


jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # Windows 콘솔 기본 인코딩(cp1252)에서 한글 출력이 깨지지 않게
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 설치 (기본 + UI)
        run: uv sync --locked --extra ui
      - name: 린트
        run: uv run ruff check .
      - name: 포맷 검사
        run: uv run ruff format --check .
      - name: 테스트 (구현 전 모듈은 skip, 연결 구조·정책표·서버는 가짜 함수로 검사)
        run: uv run pytest -q
      - name: 모듈 목록 (모듈 5개, ADR-0017)
        run: uv run clean-chat modules
      - name: 공통 계약 최신 확인 (contracts/, ADR-0015)
        run: uv run python scripts/export_contracts.py --check
