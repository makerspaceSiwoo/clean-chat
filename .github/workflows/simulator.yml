# 시뮬레이션 웹앱(simulator/) 검사: 타입 검사 + 테스트 + 빌드.
# 공통 자료(fixtures/, contracts/)가 바뀌어도 실행한다 (웹앱이 그대로 쓰므로 어긋나면 테스트가 실패).
name: simulator
on:
  pull_request:
    paths: ["simulator/**", "fixtures/**", "contracts/**", ".github/workflows/simulator.yml"]
  push:
    branches: [main, develop]
    paths: ["simulator/**", "fixtures/**", "contracts/**", ".github/workflows/simulator.yml"]

concurrency:
  group: simulator-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
      - name: 타입 검사 + 테스트 + 빌드
        run: npm run verify
