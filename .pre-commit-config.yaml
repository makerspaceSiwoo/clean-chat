# 커밋 직전에 자동 실행되는 검사. 설치: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files   # 500KB 넘는 파일 차단 (모델·영상은 git에 올리지 않음)
        args: [--maxkb=500]
        exclude: ^simulator/package-lock\.json$   # npm lock 파일은 예외
      - id: detect-private-key
      - id: no-commit-to-branch       # main 에 직접 커밋 금지 (develop 은 허용)
        args: [--branch, main]
  - repo: local   # ruff는 uv.lock 버전을 그대로 써서 CI와 결과가 같게 함
    hooks:
      - id: ruff
        name: ruff 린트
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff 포맷
        entry: uv run ruff format
        language: system
        types: [python]
      - id: branch-name
        name: 브랜치 이름 검사
        entry: bash -c 'cd scripts && python check_branch_name.py "$(git rev-parse --abbrev-ref HEAD)"'
        language: system
        pass_filenames: false
        always_run: true
